name: labels

# Creates the labels this repository uses. Run once from the Actions tab (workflow_dispatch).
on: workflow_dispatch

permissions:
  issues: write

jobs:
  labels:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/setup-labels.sh
