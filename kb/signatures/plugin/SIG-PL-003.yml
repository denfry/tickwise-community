    - fixtures/SIG-PL-003/pos-modern-console.log
    - fixtures/SIG-PL-003/pos-modern-latest-log.log
    - fixtures/SIG-PL-003/pos-legacy-backticks.log
  negative:
    - fixtures/SIG-PL-003/neg-provided-by-both.log
    - fixtures/SIG-PL-003/neg-plugin-list.log
    - fixtures/SIG-PL-003/neg-ambiguous-command.log
