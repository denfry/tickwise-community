    - fixtures/SIG-PL-010/pos-sync-task-leaf.log
    - fixtures/SIG-PL-010/pos-async-task-console.log
    - fixtures/SIG-PL-010/pos-global-region-task.log
  negative:
    - fixtures/SIG-PL-010/neg-plugin-message.log
    - fixtures/SIG-PL-010/neg-conversation.log
    - fixtures/SIG-PL-010/neg-event-pass.log
    - fixtures/SIG-PL-010/neg-task-scheduled-info.log
