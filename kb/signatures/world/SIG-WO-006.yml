    - fixtures/SIG-WO-006/pos-entity-console.log
    - fixtures/SIG-WO-006/pos-blockentity-latest.log
    - fixtures/SIG-WO-006/pos-entity-plugin-frame.log
  negative:
    - fixtures/SIG-WO-006/neg-spigot-config-entity.log
    - fixtures/SIG-WO-006/neg-duplicate-uuid.log
    - fixtures/SIG-WO-006/neg-plugin-exception-coords.log
